# Non-PD AR regression baseline for prompt lengths 1279/1280/1281.
# See docs/debugging/hunyuan_image3_pd_minimal_regression.md.
base_config: hunyuan_image_3_moe.yaml
stages:
  - stage_id: 0
    async_scheduling: false
    env:
      VLLM_OMNI_HY3_AR_EQ_DEBUG: "1"
      VLLM_OMNI_HY3_AR_EQ_DEBUG_MAX_STEP: "100"
      VLLM_OMNI_HY3_KV_CAUSAL_MODE: "off"
    default_sampling_params:
      temperature: 0.0
      n: 1
      max_tokens: 8192
      min_tokens: 0
